<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="lunarBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="60%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d24" />
    </radialGradient>
    <radialGradient id="moonGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#c4b5fd" />
      <stop offset="85%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </radialGradient>
    <radialGradient id="starGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fbbf24" />
    </radialGradient>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#lunarBg)" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Crescent Moon -->
  <path
    d="M 36 12 C 22 13 14 24 14 36 C 14 48 24 56 36 56 C 43 56 49 53 52 48 C 42 48 33 40 33 30 C 33 20 40 13 49 12 C 45 12 40 12 36 12 Z"
    fill="url(#moonGrad)"
    stroke="#ffffff"
    stroke-width="0.75"
    stroke-opacity="0.5"
  />

  <!-- 4-point radiant star nestled in moon -->
  <path
    d="M 37 20 Q 37 30 47 30 Q 37 30 37 40 Q 37 30 27 30 Q 37 30 37 20 Z"
    fill="url(#starGrad)"
    stroke="#ffffff"
    stroke-width="0.5"
  />
  <circle cx="37" cy="30" r="2" fill="#ffffff" />
</svg>
